---
entries:
  - path: "*"
    comment: "Default owner for everything not otherwise claimed"
    owners:
      - "@petergrace"
  - path: "src/"
    group: "core"
    owners:
      - "@petergrace"
  - path: "docs/"
    group: "docs"
    owners:
      - "pete.grace@gmail.com"
  - path: "src/internal/"
    group: "core"
    owners:
      - "@petergrace/teamname"
  - path: "docs/generated/"
    group: "docs"
    negate: true
    owners: []
teams:
  "@petergrace":
    - path: "src/legacy/"
      group: "core"
